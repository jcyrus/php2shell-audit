# =============================================================================
# php2shell (CVE-2026-109618 / CVE-2026-109619) — Nginx multipart guard
# php2shell-audit · https://github.com/jcyrus/php2shell-audit · BSD-3-Clause
# =============================================================================
#
# What this does
#   * Rejects Content-Type: multipart/form-data (HTTP 415) on every route except
#     the single authenticated upload endpoint /api/v1/upload. PHP only runs its
#     RFC1867 multipart parser (the php2shell entry point) for multipart bodies,
#     so this removes the parser from the unauthenticated attack surface.
#   * Caps request bodies at 1 MiB on public routes.
#   * Sends uploads through an auth_request session check, a strict rate limit
#     and fully buffered proxying to a dedicated backend.
#
# This is containment, not a fix. Patch to PHP 8.2.35 / 8.3.36 / 8.4.27 /
# 8.5.12+ as soon as possible.
#
# Install
#   This file is written for the http {} context (Debian/Ubuntu include
#   /etc/nginx/conf.d/*.conf there by default):
#     sudo cp nginx-multipart-guard.conf /etc/nginx/conf.d/php2shell-guard.conf
#   Edit server_name, certificates, root and the socket/upstream addresses,
#   then remove (or merge into) your existing server block for the same host.
#     sudo nginx -t && sudo systemctl reload nginx
#   auth_request requires ngx_http_auth_request_module (built into the nginx
#   packages from nginx.org, Debian/Ubuntu "nginx-full"/"nginx-core", and RHEL).
#
# Test (expect 415, then 401 without a session, then 413 for >1 MiB):
#   curl -s -o /dev/null -w '%{http_code}\n' -F 'a=b' https://app.example.com/
#   curl -s -o /dev/null -w '%{http_code}\n' -F 'file=@/etc/hostname' https://app.example.com/api/v1/upload
#   head -c 2000000 /dev/zero | curl -s -o /dev/null -w '%{http_code}\n' --data-binary @- https://app.example.com/login

# -----------------------------------------------------------------------------
# http {} context: classification maps and rate-limit zones
# -----------------------------------------------------------------------------

# 1 when the request is multipart and NOT addressed to the upload endpoint.
# The key is "<content-type>|<normalised uri>". [^|]* prevents a forged
# Content-Type containing "|/api/v1/upload" from matching the exemption.
# Regexes are evaluated in order; the first match wins.
map "$http_content_type|$uri" $p2s_block_multipart {
    default                                   0;
    "~*^[^|]*multipart/[^|]*\|/api/v1/upload$" 0;
    "~*multipart/"                             1;
}

# Normalised client key for rate limiting. If you sit behind Cloudflare or a
# load balancer, configure real_ip_header / set_real_ip_from first so that
# $binary_remote_addr is the client, not the proxy.
limit_req_zone  $binary_remote_addr zone=p2s_public:20m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=p2s_upload:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=p2s_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Dedicated upload backend. During a Strangler Fig migration this is the new
# Laravel 11 / PHP 8.4 upload service (docs/STRANGLER_FIG_RFC_TEMPLATE.md).
upstream p2s_upload_backend {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# server {} — legacy PHP application
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.example.com;

    ssl_certificate     /etc/ssl/certs/app.example.com.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/app.example.com.key;

    root  /var/www/app/public;
    index index.php;

    # --- Public defaults: small bodies, tight timeouts ------------------------
    client_max_body_size        1m;
    client_body_buffer_size     16k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                30s;

    # --- Server-wide multipart gate ---------------------------------------
    # Evaluated in the server rewrite phase, before any location is chosen,
    # so no location (including regex .php handlers) can bypass it.
    if ($p2s_block_multipart) {
        return 415;
    }

    # --- Authenticated upload endpoint ------------------------------------
    location = /api/v1/upload {
        limit_except POST { deny all; }

        # Session must be valid before a single body byte reaches PHP.
        auth_request     /_p2s_auth;
        auth_request_set $p2s_user_id   $upstream_http_x_auth_user_id;
        auth_request_set $p2s_user_sig  $upstream_http_x_auth_signature;

        limit_req  zone=p2s_upload burst=5 nodelay;
        limit_conn p2s_conn 4;

        client_max_body_size    20m;
        client_body_buffer_size 128k;
        client_body_timeout     30s;

        # Buffer the complete body at the edge; the backend never sees a
        # slow or partial multipart stream.
        proxy_request_buffering on;
        proxy_buffering         on;
        proxy_buffer_size       8k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
        proxy_max_temp_file_size 0;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Overwrite (never forward) any client-supplied identity headers.
        proxy_set_header   X-Auth-User-Id    $p2s_user_id;
        proxy_set_header   X-Auth-Signature  $p2s_user_sig;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_pass http://p2s_upload_backend;
    }

    # Internal session check against the legacy app. The body is never passed.
    # The endpoint implementation is in docs/STRANGLER_FIG_RFC_TEMPLATE.md §8.
    location = /_p2s_auth {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME  /var/www/app/internal/session-check.php;
        fastcgi_param REQUEST_METHOD   GET;
        fastcgi_param CONTENT_TYPE     "";
        fastcgi_param CONTENT_LENGTH   "";
        fastcgi_param X_ORIGINAL_URI   $request_uri;
        fastcgi_pass_request_body off;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
    }

    # --- Public routes --------------------------------------------------------
    location / {
        limit_req  zone=p2s_public burst=40 nodelay;
        limit_conn p2s_conn 32;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        limit_req  zone=p2s_public burst=40 nodelay;
        limit_conn p2s_conn 32;

        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param HTTP_PROXY      "";

        # Hand PHP only fully-received bodies.
        fastcgi_request_buffering on;
        fastcgi_read_timeout 30s;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
    }

    # Never expose dotfiles, VCS metadata or Composer manifests.
    location ~ /\.(?!well-known/) { deny all; }
    location ~* ^/(composer\.(json|lock)|vendor/) { deny all; }
}

# If a legacy public form genuinely needs multipart (e.g. a contact form with an
# attachment), add an explicit exemption line ABOVE the "~*multipart/" line in
# the map, e.g.:
#     "~*^[^|]*multipart/[^|]*\|/contact/attachment$" 0;
# and give that route its own location with auth/captcha and a tight body cap.
