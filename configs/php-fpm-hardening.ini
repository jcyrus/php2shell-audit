; =============================================================================
; php2shell (CVE-2026-109618 / CVE-2026-109619) — PHP & PHP-FPM hardening drop-in
; php2shell-audit · https://github.com/jcyrus28/php2shell-audit · BSD-3-Clause
; =============================================================================
;
; THESE ARE MITIGATIONS, NOT A FIX. The only fix is PHP 8.2.35 / 8.3.36 /
; 8.4.27 / 8.5.12 or later (or a vendor backport for EOL branches). These
; settings shrink the blast radius while you patch or isolate.
;
; Install (Debian/Ubuntu, Ondřej Surý packages — adjust 7.4 to your branch):
;   sudo cp php-fpm-hardening.ini /etc/php/7.4/fpm/conf.d/99-php2shell-hardening.ini
;   sudo php-fpm7.4 -tt 2>&1 | grep -E 'post_max_size|memory_limit|max_requests'
;   sudo systemctl reload php7.4-fpm
;
; RHEL/Remi:  /etc/opt/remi/php74/php.d/99-php2shell-hardening.ini
; Official Docker images: COPY to /usr/local/etc/php/conf.d/99-php2shell-hardening.ini
;
; Verify with the auditor (no FPM restart needed for the check itself):
;   php bin/php2shell-audit --ini=/etc/php/7.4/fpm/php.ini \
;       --fpm-conf=/etc/php/7.4/fpm/pool.d/www.conf --ci
;
; conf.d files are loaded after php.ini in alphabetical order, so the "99-"
; prefix makes these values win over php.ini and earlier conf.d files.
; FPM pool php_admin_value[] entries still override this file — see the pool
; section at the bottom.

; -----------------------------------------------------------------------------
; CVE-2026-109618 — OOM longjmp() state corruption
; Keep memory_limit / post_max_size >= 4 (here: 256M / 8M = 32).
; Zend HashTables for $_POST/$_FILES and nested arrays occupy 3x-8x the raw
; payload; generous headroom keeps body parsing away from the OOM bailout.
; -----------------------------------------------------------------------------
memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 8M
max_file_uploads = 5

; Fewer HashTable buckets and nesting levels per request.
max_input_vars = 1000
max_input_nesting_level = 32

; Bound how long a slow body can occupy a worker.
max_input_time = 30

; -----------------------------------------------------------------------------
; CVE-2026-109619 — stale multipart / upload-progress request state
; -----------------------------------------------------------------------------
; Required but not sufficient on its own: the multipart parser runs before any
; PHP code, so keep edge containment (nginx-multipart-guard.conf) in place.
session.upload_progress.enabled = 0
session.upload_progress.cleanup = 1

; PHP >= 8.0.28 / 8.1.16 / 8.2.3. Older runtimes ignore unknown directives, so
; this line is harmless on 7.x; enforce part limits at the edge there instead.
max_multipart_body_parts = 150

; -----------------------------------------------------------------------------
; General hygiene that limits what corrupted state can reach
; -----------------------------------------------------------------------------
expose_php = Off
display_errors = Off
log_errors = On
allow_url_include = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

; =============================================================================
; PHP-FPM POOL SETTINGS — copy into every pool file, e.g.
;   /etc/php/7.4/fpm/pool.d/www.conf   (under the [www] section)
; They are commented here because pool directives are invalid in php.ini.
; =============================================================================
;
; ; Recycle workers so corrupted heap / request state cannot persist indefinitely.
; ; 250-500 balances recycling cost against exposure; 300 is a sane default.
; pm.max_requests = 300
;
; ; Kill requests stuck in pathological parsing instead of letting them hold a worker.
; request_terminate_timeout = 60s
;
; ; Pool-level enforcement wins over php.ini and cannot be changed by ini_set().
; php_admin_flag[session.upload_progress.enabled] = off
; php_admin_value[post_max_size] = 8M
; php_admin_value[upload_max_filesize] = 8M
; php_admin_value[memory_limit] = 256M
; php_admin_value[max_input_vars] = 1000
; php_admin_value[max_input_nesting_level] = 32
; ; Only on PHP >= 8.0.28 / 8.1.16 / 8.2.3 (FPM refuses to start on unknown
; ; php_admin_value directives on some builds, so omit this line on 7.x):
; php_admin_value[max_multipart_body_parts] = 150
;
; ; Optional dedicated upload pool (served only via /api/v1/upload in
; ; nginx-multipart-guard.conf) with larger bodies but the same ratio discipline:
; ; [uploads]
; ; listen = /run/php/php7.4-fpm-uploads.sock
; ; pm = ondemand
; ; pm.max_children = 8
; ; pm.process_idle_timeout = 10s
; ; pm.max_requests = 100
; ; php_admin_value[post_max_size] = 20M
; ; php_admin_value[upload_max_filesize] = 20M
; ; php_admin_value[memory_limit] = 256M
; ; php_admin_flag[session.upload_progress.enabled] = off
