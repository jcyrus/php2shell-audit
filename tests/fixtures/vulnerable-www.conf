; Mock PHP-FPM pool for a legacy PHP 7.4 host.
; Workers are never recycled: pm.max_requests = 0. DO NOT deploy.

[www]
user = www-data
group = www-data
listen = /run/php/php7.4-fpm.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 64
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
; "Recycling caused latency spikes in 2019", so it was disabled.
pm.max_requests = 0

request_terminate_timeout = 0
catch_workers_output = yes

php_admin_value[error_log] = /var/log/php7.4-fpm-www.log
php_admin_flag[log_errors] = on
