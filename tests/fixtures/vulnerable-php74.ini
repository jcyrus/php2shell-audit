; Mock production php.ini for a legacy PHP 7.4 FPM pool.
; Intentionally vulnerable to php2shell containment checks. DO NOT deploy.

[PHP]
engine = On
short_open_tag = Off
expose_php = On
max_execution_time = 300
max_input_time = 300
memory_limit = 128M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On

; Raised years ago "to fix the bulk CSV import" — now 1/2 of memory_limit.
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 50
file_uploads = On
enable_post_data_reading = On

; Raised for a 3,000-field admin form.
max_input_vars = 5000
max_input_nesting_level = 64

[Session]
session.save_handler = files
session.save_path = "/var/lib/php/sessions"
session.use_strict_mode = 0
session.cookie_httponly =
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
